# BUILDWISE 개발 환경 — `docker compose up -d` 하나로 DB · 백엔드 · 프론트가 함께 켜집니다.
# .env 가 없어도 아래 기본값(${이름:-기본값})으로 실행됩니다. 값을 바꾸려면 .env.example 을 복사해 .env 를 만드세요.
name: buildwise

services:
  db:
    # PostgreSQL 18 + pgvector 확장이 들어 있는 공식 이미지. 버전을 고른 근거는 README '기술 스택과 고정 버전'.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: buildwise
      POSTGRES_USER: buildwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildwise}
      TZ: UTC
    ports:
      # 내 PC 에 PostgreSQL 을 따로 설치했어도(5432) 겹치지 않게 5433 으로 엽니다.
      - "${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래(18/docker)에 데이터를 둡니다.
      - pg-data:/var/lib/postgresql
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U buildwise -d buildwise"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    environment:
      BUILDWISE_DATABASE_URL: postgresql+psycopg://buildwise:${POSTGRES_PASSWORD:-buildwise}@db:5432/buildwise
      BUILDWISE_TEST_DATABASE_URL: postgresql+psycopg://buildwise:${POSTGRES_PASSWORD:-buildwise}@db:5432/buildwise_test
      BUILDWISE_MOCK_DELAY_MS: ${BUILDWISE_MOCK_DELAY_MS:-400}
      API_PORT: ${API_PORT:-8000}
      # Windows 에서 저장한 파일 변경을 컨테이너가 알아채게 합니다.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/workspace
      - backend-venv:/opt/venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - ./contracts:/workspace/contracts
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  pg-data:
  backend-venv:
  frontend-node-modules:
