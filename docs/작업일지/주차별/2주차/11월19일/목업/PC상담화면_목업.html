<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUILDWISE PC 상담 목업</title>
<style>
:root{--ac:#0f766e;--ac2:#14b8a6;--acbg:#e6f6f3;--bg:#f5f7f9;--card:#fff;--line:#e3e7ec;--tx:#1f2933;--mu:#6b7785;--ok:#15803d;--warn:#c2410c;--warnbg:#fff4e5;--no:#9aa5b1;--yl:#fff7d6}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
.logo{font-weight:800;color:var(--ac);letter-spacing:.5px}
.shop{color:var(--mu)}
.stepper{display:flex;gap:6px;margin-left:auto}
.stepper span{padding:5px 10px;border-radius:999px;background:#eef1f4;color:var(--mu);font-size:12px}
.stepper span.on{background:var(--ac);color:#fff}
.stepper span.done{background:var(--acbg);color:var(--ac)}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.pri:hover{background:#0b5f58}
.btn.ghost{border:none;background:none;color:var(--ac);padding:4px 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.press{outline:3px solid var(--ac2)!important;outline-offset:2px;transform:scale(.97);transition:.15s}
h2{margin:0 0 6px;font-size:20px}
.sub{color:var(--mu);margin:0 0 16px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:40px auto}
.type{border:2px solid var(--line);border-radius:16px;background:#fff;padding:32px;text-align:left;transition:.2s}
.type:hover{border-color:var(--ac);transform:translateY(-2px)}
.type .ic{font-size:34px}
.type b{display:block;font-size:19px;margin:10px 0 6px}
.form{max-width:760px;margin:0 auto}
.row{margin-bottom:16px}
.row label{display:block;font-weight:600;margin-bottom:6px}
.row input[type=text],.row input[type=number],.row select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.three{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;align-items:start}
.teams{display:flex;gap:6px;margin-bottom:12px}
.team{flex:1;text-align:center;font-size:12px;padding:6px 4px;border-radius:8px;background:#eef1f4;color:var(--mu)}
.team.work{background:var(--acbg);color:var(--ac);animation:blink 1s infinite}
.team.ok{background:#e8f5ec;color:var(--ok)}
@keyframes blink{50%{opacity:.5}}
.log{height:560px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.log div{padding:8px 10px;border-radius:8px;background:#f7f9fa;font-size:13px;line-height:1.5;animation:up .3s}
.log div b{color:var(--ac)}
.log div.v b{color:#7c3aed}.log div.q b{color:#b45309}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.ctitle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ctitle h3{margin:0;font-size:17px}
.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#eef1f4;color:var(--mu)}
.order{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.order span{font-size:12px;padding:4px 8px;border-radius:6px;background:#eef1f4;color:var(--mu)}
.order span.on{background:var(--ac);color:#fff}.order span.done{background:var(--acbg);color:var(--ac)}
.pipe{display:flex;flex-direction:column;gap:10px;padding:30px 10px}
.pipe div{display:flex;align-items:center;gap:10px;color:var(--mu)}
.pipe div.on{color:var(--tx);font-weight:600}.pipe div.ok{color:var(--ok)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.on .dot{border-color:var(--ac);border-top-color:transparent;animation:spin .8s linear infinite}
.ok .dot{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cand{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative;animation:up .35s both}
.cand.rec{border:3px solid var(--ac);box-shadow:0 0 0 4px var(--acbg)}
.cand .img{height:70px;border-radius:8px;background:#eef1f4;display:flex;align-items:center;justify-content:center;color:var(--no);font-size:12px;margin-bottom:8px}
.cand .nm{font-weight:700;margin-bottom:4px}
.cand .sp{color:var(--mu);font-size:12px;line-height:1.5;min-height:36px}
.cand .pr{font-size:16px;font-weight:800;margin:8px 0}
.cand .pr small{font-size:11px;color:var(--no);font-weight:400}
.badge{position:absolute;top:-10px;left:10px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.cand.dis{opacity:.5}
.fails{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.fails summary{cursor:pointer;color:var(--mu);font-size:13px}
.fail{display:flex;justify-content:space-between;padding:6px 0;color:var(--no);font-size:13px}
.adj{background:var(--warnbg);border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.adj b{color:var(--warn)}
.mine{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mine div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;background:#f7f9fa}
.mine div.new{background:var(--acbg)}
.mine div.keep{color:var(--mu)}
.bar{height:10px;border-radius:999px;background:#eef1f4;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
.bar i.over{background:var(--warn)}
.money{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:600;font-size:13px}
td.r,th.r{text-align:right}
tr.chg td{background:var(--yl)}
.tot td{font-weight:800;font-size:16px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:#fff;border-radius:14px;padding:22px;width:420px}
.donecard{max-width:560px;margin:40px auto;text-align:center}
.donecard .big{font-size:44px}
.demo{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:230px;z-index:30}
.demo .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:700;border-bottom:1px solid var(--line);cursor:pointer}
.demo .bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.demo.fold .bd{display:none}
.demo .bd .btn{width:100%;text-align:left;font-size:13px}
header{flex-wrap:wrap}.stepper span{white-space:nowrap}
@media(max-width:1100px){.three{grid-template-columns:1fr}.log{height:220px}.types{grid-template-columns:1fr}}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:999px;z-index:40;animation:up .3s}
</style>
</head>
<body>
<header>
  <span class="logo">BUILDWISE</span><span class="shop">가상전자 · PC 상담 창구</span>
  <div class="stepper" id="stepper"></div>
</header>
<main id="app"></main>
<div class="demo" id="demo">
  <div class="hd" onclick="this.parentNode.classList.toggle('fold')">시연 패널 <span>▾</span></div>
  <div class="bd">
    <button class="btn" onclick="autoReplace()">▶ 부품 교체 자동 재생</button>
    <button class="btn" onclick="autoNew()">▶ 신규 조립 자동 재생</button>
    <button class="btn" id="spd" onclick="toggleSpeed()">속도 2배</button>
    <button class="btn" onclick="reset()">처음으로</button>
  </div>
</div>
<script>
const won=n=>n.toLocaleString('ko-KR')+'원';
const CAT={CPU:'CPU',MB:'메인보드',RAM:'RAM',GPU:'그래픽카드',SSD:'저장장치',COOLER:'쿨러',PSU:'파워서플라이',CASE:'케이스'};
const ORDER=['CPU','MB','RAM','GPU','SSD','COOLER','PSU','CASE'];
const P={
CPU:[{id:'c1',n:'코어 i5급 14400F',p:239000,s:980,t:1,sock:'LGA1700',w:65,sp:'6P+4E코어 · LGA1700'},{id:'c2',n:'라이젠 5급 7600',p:259000,s:870,t:1,sock:'AM5',w:65,sp:'6코어 · AM5'},{id:'c3',n:'코어 i7급 14700F',p:479000,s:640,t:2,sock:'LGA1700',w:125,sp:'20코어 · LGA1700'},{id:'c4',n:'라이젠 7급 7800X3D',p:529000,s:910,t:2,sock:'AM5',w:120,sp:'8코어 3D캐시 · AM5'},{id:'c5',n:'라이젠 9급 7900X',p:589000,s:300,t:3,sock:'AM5',w:170,sp:'12코어 · AM5'}],
MB:[{id:'m1',n:'B650 메인보드',p:219000,s:800,sock:'AM5',mem:'DDR5',sp:'AM5 · DDR5 · M.2 3개'},{id:'m2',n:'X670 메인보드',p:359000,s:300,sock:'AM5',mem:'DDR5',sp:'AM5 · DDR5 · PCIe 5.0'},{id:'m3',n:'B760 메인보드',p:189000,s:850,sock:'LGA1700',mem:'DDR5',sp:'LGA1700 · DDR5'},{id:'m4',n:'B660 메인보드',p:149000,s:500,sock:'LGA1700',mem:'DDR4',sp:'LGA1700 · DDR4'},{id:'m5',n:'A620 메인보드',p:129000,s:400,sock:'AM5',mem:'DDR5',sp:'AM5 · DDR5 · 기본형'}],
RAM:[{id:'r1',n:'DDR5 32GB (16GB×2) 5600',p:139000,s:900,mem:'DDR5',gb:32,sp:'DDR5 · 듀얼 채널'},{id:'r2',n:'DDR5 64GB (32GB×2) 5600',p:269000,s:350,mem:'DDR5',gb:64,sp:'DDR5 · 대용량 편집용'},{id:'r3',n:'DDR5 16GB (8GB×2) 5600',p:79000,s:500,mem:'DDR5',gb:16,sp:'DDR5 · 입문'},{id:'r4',n:'DDR4 32GB (16GB×2) 3200',p:99000,s:700,mem:'DDR4',gb:32,sp:'DDR4 · 듀얼 채널'},{id:'r5',n:'DDR4 16GB (8GB×2) 3200',p:52000,s:650,mem:'DDR4',gb:16,sp:'DDR4 · 입문'},{id:'r6',n:'DDR4 32GB (16GB×2) 3600 방열판',p:119000,s:300,mem:'DDR4',gb:32,sp:'DDR4 · 고클럭'}],
GPU:[{id:'g1',n:'RTX 4060급 8GB',p:399000,s:950,t:1,w:115,len:240,sp:'FHD 고옵션 · 115W'},{id:'g2',n:'RX 7600급 8GB',p:339000,s:500,t:1,w:165,len:250,sp:'FHD~QHD · 165W'},{id:'g3',n:'RTX 4060 Ti급 8GB',p:529000,s:700,t:2,w:160,len:250,sp:'QHD 고옵션 · 160W'},{id:'g4',n:'RTX 4070급 12GB',p:799000,s:880,t:2,w:200,len:300,sp:'QHD 144프레임 · 200W'},{id:'g5',n:'RX 7800 XT급 16GB',p:699000,s:420,t:2,w:263,len:320,sp:'QHD 고옵션 · 263W'},{id:'g8',n:'RX 7900 GRE급 16GB',p:789000,s:260,t:2,w:260,len:310,sp:'QHD~4K · 260W'},{id:'g6',n:'RTX 4070 Ti SUPER급 16GB',p:1049000,s:380,t:3,w:285,len:330,sp:'4K 편집·게임 · 285W'},{id:'g7',n:'RTX 4080 SUPER급 16GB',p:1399000,s:300,t:3,w:320,len:340,sp:'4K 최고옵션 · 320W'}],
SSD:[{id:'s2',n:'NVMe SSD 2TB Gen4',p:179000,s:960,sp:'읽기 7,000MB/s'},{id:'s1',n:'NVMe SSD 1TB Gen4',p:89000,s:900,sp:'읽기 7,000MB/s'},{id:'s3',n:'NVMe SSD 500GB',p:59000,s:400,sp:'읽기 3,500MB/s'},{id:'s4',n:'NVMe SSD 4TB Gen4',p:389000,s:200,sp:'읽기 7,000MB/s'}],
COOLER:[{id:'k1',n:'공랭 타워 쿨러',p:39000,s:900,sp:'4히트파이프 · 저소음'},{id:'k2',n:'240mm 수랭 쿨러',p:119000,s:500,sp:'일체형 수랭'},{id:'k3',n:'360mm 수랭 쿨러',p:169000,s:300,sp:'고발열 CPU용'}],
PSU:[{id:'p2',n:'650W 80PLUS 브론즈',p:79000,s:900,cap:650,sp:'650W · 브론즈'},{id:'p3',n:'750W 80PLUS 골드',p:119000,s:700,cap:750,sp:'750W · 골드'},{id:'p1',n:'500W 80PLUS 브론즈',p:59000,s:600,cap:500,sp:'500W · 브론즈'},{id:'p4',n:'850W 80PLUS 골드',p:149000,s:400,cap:850,sp:'850W · 골드'}],
CASE:[{id:'x1',n:'미들타워 케이스 블랙',p:79000,s:900,max:330,col:'블랙',sp:'그래픽카드 330mm까지 · 블랙'},{id:'x4',n:'미들타워 케이스 화이트',p:85000,s:700,max:330,col:'화이트',sp:'그래픽카드 330mm까지 · 화이트'},{id:'x2',n:'미니타워 케이스 블랙',p:59000,s:500,max:280,col:'블랙',sp:'그래픽카드 280mm까지 · 블랙'},{id:'x5',n:'강화유리 케이스 화이트',p:109000,s:400,max:360,col:'화이트',sp:'그래픽카드 360mm까지 · 화이트'},{id:'x3',n:'빅타워 강화유리 블랙',p:139000,s:300,max:400,col:'블랙',sp:'그래픽카드 400mm까지 · 블랙'},{id:'x6',n:'미니타워 화이트',p:65000,s:300,max:280,col:'화이트',sp:'그래픽카드 280mm까지 · 화이트'}]};
const OWNED={CPU:{n:'코어 i5급 12400',sock:'LGA1700',w:65},MB:{n:'B660 메인보드',sock:'LGA1700',mem:'DDR4'},RAM:{n:'DDR4 16GB',mem:'DDR4',gb:16},GPU:{n:'GTX 1660급 6GB',w:125,len:230},SSD:{n:'NVMe SSD 500GB'},PSU:{n:'500W 브론즈',cap:500}};
let S,speed=1,running=false,RUN={};
function init(){S={screen:'type',mode:null,sv:{purpose:[],budget:0,perf:'',problem:''},budget:0,sel:{},queue:[],idx:0,phase:'idle',pipe:0,cands:null,boost:null,adjust:null,adjOffer:null,ver:0,quote:null,prev:null,changeCat:null,white:false,teams:{d:'',v:'',q:''},logs:[],modal:null}}
const wait=ms=>new Promise(r=>setTimeout(r,ms/speed));
function log(team,msg){S.logs.push({team,msg});const el=document.getElementById('log');if(el){const d=document.createElement('div');d.className=team==='검증팀'?'v':team==='견적팀'?'q':'';d.innerHTML='<b>'+team+'</b> '+msg;el.appendChild(d);el.scrollTop=1e6}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function spent(){return Object.values(S.sel).reduce((a,b)=>a+b.p,0)}
function left(){return S.budget-spent()}
function cur(){return S.queue[S.idx]}
function ctx(){return S.mode==='replace'?Object.assign({},OWNED,S.sel):Object.assign({},S.sel)}
function needTier(){return S.sv.purpose.some(x=>/편집|AI/.test(x))?2:1}
function evalCat(cat,c,opts={}){const pass=[],fail=[];const remain=opts.ignoreBudget?1e12:left();
 for(const it of P[cat]){let r=null;
  if(cat==='CPU'&&S.mode==='new'&&it.t<needTier())r='목표 성능에 못 미침 (설계팀 제외)';
  if(cat==='GPU'&&S.mode==='new'&&it.t<needTier())r='목표 성능에 못 미침 (설계팀 제외)';
  if(cat==='MB'&&c.CPU&&it.sock!==c.CPU.sock)r='CPU 소켓('+c.CPU.sock+')과 맞지 않음';
  if(cat==='RAM'&&c.MB&&it.mem!==c.MB.mem)r='메인보드가 '+c.MB.mem+'만 지원';
  if(cat==='RAM'&&S.mode==='replace'&&it.gb<=16&&!r)r='지금과 같은 16GB (교체 효과 없음)';
  if(cat==='GPU'&&c.PSU&&((c.CPU?c.CPU.w:65)+it.w+50)*1.3>c.PSU.cap)r='파워 '+c.PSU.cap+'W로 부족';
  if(cat==='GPU'&&c.CASE&&it.len>c.CASE.max)r='케이스에 안 들어감';
  if(cat==='PSU'&&c.GPU&&((c.CPU?c.CPU.w:65)+c.GPU.w+50)*1.3>it.cap)r='소비 전력 대비 용량 부족';
  if(cat==='CASE'&&c.GPU&&c.GPU.len>it.max)r='그래픽카드 '+c.GPU.len+'mm > 허용 '+it.max+'mm';
  if(cat==='CASE'&&opts.white&&it.col!=='화이트'&&!r)r=null,it._skip=1;
  if(opts.boost&&!r){if(it.p<=opts.boost.from||it.p>opts.boost.cap)it._skip=1}
  if(it._skip){delete it._skip;continue}
  if(r){fail.push({it,r});continue}
  pass.push(it)}
 if(S.mode==='replace')pass.sort((a,b)=>a.p-b.p);else pass.sort((a,b)=>b.s-a.s);
 if(cat==='SSD'&&S.adjust){const i=pass.findIndex(x=>x.id==='s1');if(i>0)pass.unshift(pass.splice(i,1)[0])}
 pass.forEach(x=>x._over=x.p>remain);
 return{pass,fail}}
function estimate(extra){const c=Object.assign({},S.sel,extra);let tot=0;for(const k of ORDER){if(!c[k]){const sv=S.sel;const tmpSel=S.sel;S.sel=c;const r=evalCat(k,c,{ignoreBudget:1});S.sel=tmpSel;let pick=r.pass[0];if(k==='SSD'&&extra._adj)pick=P.SSD.find(x=>x.id==='s1');c[k]=pick}tot+=c[k].p}return tot}
function stepIdx(){return{type:1,survey:2,consult:3,quote:4,done:5,pay:5}[S.screen]}
function render(){const si=stepIdx();document.getElementById('stepper').innerHTML=['상담 유형','설문','상담','견적','승인'].map((t,i)=>'<span class="'+(i+1===si?'on':i+1<si?'done':'')+'">'+(i+1)+' '+t+'</span>').join('');
 const a=document.getElementById('app');
 if(S.screen==='type')a.innerHTML=`<div style="text-align:center;margin-top:30px"><h2>어떤 상담이 필요하세요?</h2><p class="sub">상담 전에 몇 가지만 알려 주시면 AI 업무팀이 맞춰 드려요.</p></div><div class="types"><button class="type" data-a="t-replace" onclick="pickType('replace')"><div class="ic">🔧</div><b>기존 PC 부품 교체</b><span class="sub">지금 PC에서 바꿀 부품만 골라 드려요</span></button><button class="type" data-a="t-new" onclick="pickType('new')"><div class="ic">🖥️</div><b>신규 PC 조립</b><span class="sub">목적과 예산에 맞춰 처음부터 맞춰 드려요</span></button></div>`;
 if(S.screen==='survey')a.innerHTML=surveyHTML();
 if(S.screen==='consult')a.innerHTML=consultHTML();
 if(S.screen==='quote')a.innerHTML=quoteHTML();
 if(S.screen==='done')a.innerHTML=`<div class="card donecard"><div class="big">✅</div><h2>견적 v${S.ver}를 저장했습니다</h2><p class="sub">견적 번호 Q-2026-${1040+S.ver} · ${new Date().toLocaleTimeString('ko-KR')} · 총액 <b>${won(S.quote.total)}</b></p>${S.mode==='replace'?'<p class="sub">잠시 후 결제 화면으로 이동합니다…</p>':'<p class="sub">신규 조립 결제 화면은 이번 시연 범위 밖입니다.</p><button class="btn" onclick="reset()">처음으로</button>'}</div>`;
 if(S.screen==='pay')a.innerHTML=`<div class="card donecard" style="text-align:left"><h2>결제</h2><p class="sub">견적 Q-2026-${1040+S.ver} · 총액 <b>${won(S.quote.total)}</b></p><div class="chips" style="margin-bottom:16px"><span class="chip on">신용카드</span><span class="chip">계좌이체</span><span class="chip">간편결제</span></div><button class="btn pri" data-a="pay" onclick="toast('시연용 화면입니다. 실제 결제는 일어나지 않아요')">결제하기</button></div>`;
 if(S.modal)a.insertAdjacentHTML('beforeend',S.modal);
 const lg=document.getElementById('log');if(lg){lg.innerHTML='';const l=S.logs;S.logs=[];l.forEach(x=>log(x.team,x.msg))}}
function pickType(m){S.mode=m;S.screen='survey';render()}
function surveyHTML(){const r=S.mode==='replace';const pur=['고사양 게임','이미지 편집','동영상 편집','사무','AI 개발'];
 const chips=pur.map(p=>`<button class="chip ${S.sv.purpose.includes(p)?'on':''}" onclick="togP('${p}')">${p}</button>`).join('');
 const owned=r?`<div class="row"><label>현재 보유 부품</label><div class="grid2">${Object.entries(OWNED).map(([k,v])=>`<select><option>${CAT[k]}: ${v.n}</option></select>`).join('')}</div></div>`:'';
 return `<div class="form card"><h2>${r?'기존 PC 부품 교체':'신규 PC 조립'} · 상담 전 설문</h2><p class="sub">입력한 내용은 상담 내내 설계팀이 참고해요. <button class="btn ghost" data-a="fill" onclick="fill()">예시로 채우기</button></p>
 ${owned}<div class="row"><label>${r?'전체 교체 예산':'전체 예산'}</label><input type="number" id="bud" value="${S.sv.budget||''}" placeholder="예: 800000"></div>
 <div class="row"><label>${r?'사용 목적':'주요 사용 목적'}</label><div class="chips">${chips}</div></div>
 ${r?`<div class="row"><label>지금 겪는 문제</label><input type="text" id="prob" value="${S.sv.problem}" placeholder="예: 원하는 게임이 끊겨요"></div>`:`<div class="row"><label>원하는 성능</label><input type="text" id="perf" value="${S.sv.perf}" placeholder="예: 4K 편집 원활"></div>`}
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="S.screen='type';render()">이전</button><button class="btn pri" data-a="start" onclick="startConsult()">상담 시작</button></div></div>`}
function togP(p){const i=S.sv.purpose.indexOf(p);i<0?S.sv.purpose.push(p):S.sv.purpose.splice(i,1);keep();render()}
function keep(){const b=document.getElementById('bud');if(b)S.sv.budget=+b.value||0;const pr=document.getElementById('prob');if(pr)S.sv.problem=pr.value;const pf=document.getElementById('perf');if(pf)S.sv.perf=pf.value}
function fill(){if(S.mode==='replace')S.sv={purpose:['고사양 게임'],budget:800000,problem:'QHD에서 프레임이 낮고 게임이 끊겨요',perf:''};else S.sv={purpose:['동영상 편집','고사양 게임'],budget:2300000,perf:'4K 편집 원활 · QHD 게임',problem:''};render()}
async function startConsult(){keep();if(!S.sv.budget){toast('예산을 입력해 주세요');return}if(!S.sv.purpose.length){toast('사용 목적을 하나 이상 골라 주세요');return}
 S.budget=S.sv.budget;S.screen='consult';S.queue=S.mode==='replace'?[]:ORDER.slice();S.idx=0;S.phase='analyze';render();
 S.teams.d='work';render();
 if(S.mode==='replace'){log('설계팀','보유 부품과 문제를 살펴보고 있어요: “'+S.sv.problem+'”');await wait(1100);log('설계팀','GTX 1660급 GPU가 QHD 목표 성능에 부족하고, RAM 16GB도 최신 게임엔 빠듯해요. <b>GPU → RAM</b> 순서로 바꾸면 해결됩니다.');S.queue=['GPU','RAM']}
 else{log('설계팀','목적(“'+S.sv.purpose.join(', ')+'”)과 예산 '+won(S.budget)+'을 기준으로 CPU부터 맞춰 볼게요.');await wait(900)}
 await loadStep()}
async function loadStep(opts={}){const cat=cur();S.phase='load';S.pipe=1;S.teams={d:'work',v:'',q:''};render();
 log('설계팀',CAT[cat]+' 후보를 상품 DB에서 찾고 있어요'+(S.mode==='replace'?' (남은 예산 '+won(left())+')':' (판매량 높은 순)'));await wait(900);
 S.pipe=2;S.teams={d:'ok',v:'work',q:''};render();log('검증팀',(S.mode==='replace'?'보유 부품':'앞서 고른 부품')+'과의 호환성을 확인하고 있어요');await wait(1000);
 const r=evalCat(cat,ctx(),{boost:opts.boost,white:S.changeCat===cat&&S.white});S.cands=r;S.pipe=3;S.teams={d:'ok',v:'ok',q:''};
 log('검증팀','통과 '+r.pass.length+'개'+(r.fail.length?', 제외 '+r.fail.length+'개 ('+r.fail[0].r+' 등)':''));
 log('설계팀',S.mode==='replace'?'가격 낮은 순으로 보여 드려요. 가장 저렴한 후보를 AI 추천으로 표시했어요.':'조건을 맞춘 후보를 판매량 순으로 보여 드려요.');
 S.phase='pick';render()}
function consultHTML(){const cat=cur();let center='';
 const ord=S.mode==='new'?`<div class="order">${ORDER.map((k,i)=>`<span class="${k===cat&&S.phase!=='finish'?'on':S.sel[k]?'done':''}">${S.sel[k]?'✓ ':''}${CAT[k]}</span>`).join('')}</div>`:(S.queue.length?`<div class="order">${S.queue.map(k=>`<span class="${k===cat&&S.phase!=='finish'?'on':S.sel[k]?'done':''}">${S.sel[k]?'✓ ':''}${CAT[k]} 교체</span>`).join('')}</div>`:'');
 if(S.phase==='analyze')center=`<div class="pipe"><div class="on"><span class="dot"></span>설계팀이 설문을 확인하고 있어요</div></div>`;
 else if(S.phase==='load')center=`<div class="pipe">${['설계팀: '+CAT[cat]+' 후보 조회','검증팀: 호환성 확인','후보 정리'].map((t,i)=>`<div class="${S.pipe>i+1?'ok':S.pipe===i+1?'on':''}"><span class="dot"></span>${t}</div>`).join('')}</div>`;
 else if(S.phase==='finish')center=`<div style="text-align:center;padding:50px 10px"><div style="font-size:40px">🎉</div><h3>${S.changeCat?'변경할 부품을 골랐어요':'모든 부품을 골랐어요'}</h3><p class="sub">설계팀이 선택 내역을 견적팀에 넘길게요.</p><button class="btn pri" data-a="toquote" onclick="toQuote()">견적 받기</button></div>`;
 else if(S.phase==='pick'){const r=S.cands;
  const adj=S.adjOffer?`<div class="adj"><b>예산 조정 제안</b> · 그래픽카드 예산을 늘리면 총액이 ${won(S.adjOffer.before)}로 예산(${won(S.budget)})을 넘어요.<br>저장장치를 <b>2TB → 1TB</b>로 바꾸면 <b>-${won(90000)}</b> · 변경 후 예상 총액 <b>${won(S.adjOffer.after)}</b><div style="margin-top:8px;display:flex;gap:8px"><button class="btn pri" data-a="adj-ok" onclick="acceptAdj(true)">제안대로 조정</button><button class="btn" onclick="acceptAdj(false)">그대로 진행</button></div></div>`:'';
  center=adj+`<div class="cands">${r.pass.map((it,i)=>{const rec=i===0&&!it._over;const badge=rec?(S.mode==='replace'?'AI 추천 · 최저가':(cat==='SSD'&&S.adjust?'조정 제안 반영':(S.boost&&S.boost.cat===cat?'예산 상향 추천':'인기 1위 · AI 추천'))):'';
   return `<div class="cand ${rec?'rec':''} ${it._over?'dis':''}" style="animation-delay:${i*0.08}s">${badge?'<span class="badge">'+badge+'</span>':''}<div class="img">${CAT[cat]} 이미지</div><div class="nm">${it.n}</div><div class="sp">${it.sp}${S.mode==='new'?'<br>판매 '+it.s.toLocaleString()+'건':''}</div><div class="pr">${won(it.p)} <small>예시 가격</small></div>${it._over?'<button class="btn" disabled>예산 초과</button>':`<button class="btn ${rec?'pri':''}" data-a="pick-${it.id}" onclick="choose('${it.id}')">선택</button>`}${S.mode==='new'&&!S.changeCat?` <button class="btn ghost" data-a="boost-${it.id}" onclick="openBoost()">이 부품에 예산 더 쓰기</button>`:''}</div>`}).join('')}</div>`+
  (r.fail.length?`<details class="fails" open><summary>호환·조건에서 제외된 후보 ${r.fail.length}개</summary>${r.fail.map(f=>`<div class="fail"><span>${f.it.n}</span><span>${f.r}</span></div>`).join('')}</details>`:'')}
 const mineRows=S.mode==='replace'?Object.keys(OWNED).map(k=>S.sel[k]?`<div class="new"><span>${CAT[k]}</span><span>${S.sel[k].n}</span></div>`:`<div class="keep"><span>${CAT[k]}</span><span>${OWNED[k].n} (보유)</span></div>`).join(''):ORDER.map(k=>`<div class="${S.sel[k]?'new':'keep'}"><span>${CAT[k]}</span><span>${S.sel[k]?S.sel[k].n:'—'}</span></div>`).join('');
 const pct=Math.min(100,spent()/S.budget*100);
 return `<div class="three"><div class="card"><div class="teams"><span class="team ${S.teams.d}">설계팀</span><span class="team ${S.teams.v}">검증팀</span><span class="team ${S.teams.q}">견적팀</span></div><div class="log" id="log"></div></div>
 <div class="card"><div class="ctitle"><h3>${S.phase==='finish'?'선택 완료':cat?CAT[cat]+' 고르기':'상담 준비 중'}</h3><span class="pill">${S.mode==='replace'?'기존 PC 부품 교체':'신규 PC 조립'}</span></div>${ord}${center}</div>
 <div class="card"><h3 style="margin:0">내 구성 · 예산</h3><div class="bar"><i class="${spent()>S.budget?'over':''}" style="width:${pct}%"></i></div><div class="money"><span>사용 ${won(spent())}</span><span>남음 ${won(left())}</span></div><div class="money"><span>전체 예산</span><span>${won(S.budget)}</span></div><div class="mine">${mineRows}</div></div></div>`}
async function choose(id){const cat=cur();const it=P[cat].find(x=>x.id===id);S.sel[cat]=it;log('설계팀',CAT[cat]+' → <b>'+it.n+'</b> 선택 ('+won(it.p)+')');S.boost=null;S.adjOffer=null;
 if(S.changeCat){S.phase='finish';render();return}
 S.idx++;if(S.idx<S.queue.length){S.phase='load';S.pipe=0;render();await wait(300);await loadStep()}else{S.phase='finish';S.teams={d:'ok',v:'ok',q:''};render()}}
function openBoost(){const cat=cur();const top=S.cands.pass[0];S.modal=`<div class="modal-bg"><div class="modal"><h3 style="margin-top:0">${CAT[cat]}에 얼마까지 쓰실 건가요?</h3><p class="sub">지금 추천은 ${won(top.p)}이에요. 늘릴 금액을 골라 주세요.</p><div class="chips" style="margin-bottom:14px">${[100000,200000,300000].map(v=>`<button class="chip" data-a="boost-${v}" onclick="doBoost(${v})">+${v/10000}만 원</button>`).join('')}</div><button class="btn" onclick="S.modal=null;render()">취소</button></div></div>`;render()}
async function doBoost(v){const cat=cur();const top=S.cands.pass[0];S.modal=null;S.boost={cat,from:top.p,cap:top.p+v};log('설계팀',CAT[cat]+' 예산을 '+won(top.p+v)+'까지 늘려서 다시 찾을게요');
 await loadStep({boost:S.boost});const nt=S.cands.pass[0];if(nt){const before=estimate({[cat]:nt});if(before>S.budget){const after=estimate({[cat]:nt,_adj:1});S.adjOffer={before,after};log('설계팀','이대로면 총액이 예산을 넘어요. 저장장치를 1TB로 줄이는 조정안을 함께 보여 드려요.');render()}}}
function acceptAdj(ok){S.adjust=ok;S.adjOffer=null;log('설계팀',ok?'조정안 반영: 저장장치는 1TB를 먼저 추천할게요.':'조정 없이 진행할게요. 뒤 단계에서 예산 초과 후보는 고를 수 없어요.');render()}
async function toQuote(){S.screen='quote';S.teams={d:'ok',v:'ok',q:'work'};S.quote=null;render();log('견적팀','확정된 구성으로 견적을 만들고 있어요');await wait(1200);
 if(!S.quoteCats)S.quoteCats=S.mode==='replace'?S.queue.slice():ORDER;const cats=S.quoteCats;S.ver++;const lines=cats.map(k=>({k,n:S.sel[k].n,p:S.sel[k].p}));S.quote={lines,total:lines.reduce((a,b)=>a+b.p,0),time:new Date().toLocaleTimeString('ko-KR')};S.quote0=S.quote;S.teams.q='ok';log('견적팀','견적 v'+S.ver+' 완성: 총액 '+won(S.quote.total));render()}
function quoteHTML(){if(!S.quote)return `<div class="card" style="max-width:760px;margin:0 auto"><div class="pipe"><div class="on"><span class="dot"></span>견적팀이 견적을 만들고 있어요</div></div></div>`;
 const q=S.quote;return `<div class="card" style="max-width:820px;margin:0 auto"><div class="ctitle"><h3>견적 v${S.ver}</h3><span class="pill">${q.time} 생성</span><span class="pill">${S.mode==='replace'?'부품 교체':'신규 조립'}</span></div>
 <table><tr><th>부품</th><th>부품명</th><th class="r">가격</th></tr>${q.lines.map(l=>`<tr class="${S.changeCat===l.k?'chg':''}"><td>${CAT[l.k]}</td><td>${l.n}${S.changeCat===l.k?' <span class="pill">변경됨</span>':''}</td><td class="r">${won(l.p)}</td></tr>`).join('')}<tr class="tot"><td colspan="2">합계</td><td class="r">${won(q.total)}</td></tr></table>
 <p class="sub" style="margin-top:10px">예산 ${won(S.budget)} · ${q.total<=S.budget?'예산 안':'예산 초과'} · 가격은 예시입니다</p>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-a="change" onclick="openChange()">변경 요청</button><button class="btn pri" data-a="approve" onclick="approve()">이 견적 승인</button></div></div>`}
function openChange(){const cats=S.quote.lines.map(l=>l.k);S.modal=`<div class="modal-bg"><div class="modal"><h3 style="margin-top:0">어떤 부품을 바꿀까요?</h3><div class="row"><label>부품</label><select id="chCat">${cats.map(k=>`<option value="${k}" ${k==='CASE'?'selected':''}>${CAT[k]} · ${S.sel[k].n}</option>`).join('')}</select></div><div class="row"><label>요청 내용</label><input type="text" id="chTxt" placeholder="예: 케이스를 흰색으로 바꾸고 싶어요"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="S.modal=null;render()">취소</button><button class="btn pri" data-a="ch-send" onclick="sendChange()">설계팀에 요청</button></div></div></div>`;render()}
async function sendChange(){const cat=document.getElementById('chCat').value,txt=document.getElementById('chTxt').value||'다른 제품으로 바꾸고 싶어요';S.modal=null;S.changeCat=cat;S.white=/흰|화이트/.test(txt);delete S.sel[cat];S.screen='consult';S.queue=[cat];S.idx=0;S.phase='load';S.pipe=0;log('견적팀','변경 요청 “'+txt+'” → '+CAT[cat]+'을 설계팀에 돌려보냈어요');render();await wait(400);await loadStep()}
async function approve(){S.screen='done';render();toast('승인한 견적 v'+S.ver+'를 DB 견적 테이블에 저장했어요');if(S.mode==='replace'){await wait(1500);S.screen='pay';render()}}
function reset(){running=false;RUN={};S&&(S.modal=null);init();render()}
function toggleSpeed(){speed=speed===1?2:1;document.getElementById('spd').textContent=speed===1?'속도 2배':'보통 속도'}
async function w(ms,me){await wait(ms);if(me!==RUN)throw 'stop'}
async function press(sel,me,fn){for(let i=0;i<60&&!document.querySelector(sel);i++)await w(150,me);const el=document.querySelector(sel);if(!el)throw new Error('찾을 수 없음 '+sel);el.classList.add('press');await w(450,me);if(fn)fn();else el.click()}
async function untilPick(me){for(let i=0;i<80&&S.phase!=='pick'&&S.phase!=='finish';i++)await w(150,me)}
async function autoReplace(){reset();const me=RUN;running=true;try{await w(400,me);await press('[data-a="t-replace"]',me);await w(500,me);await press('[data-a="fill"]',me);await w(600,me);await press('[data-a="start"]',me);
 for(let n=0;n<2;n++){await untilPick(me);await w(900,me);const id=S.cands.pass[0].id;await press('[data-a="pick-'+id+'"]',me)}
 await w(800,me);await press('[data-a="toquote"]',me);await w(2200,me);await press('[data-a="approve"]',me);await w(3000,me);await press('[data-a="pay"]',me)}catch(e){if(e!=='stop')console.log(e)}running=false}
async function autoNew(){reset();const me=RUN;running=true;try{await w(400,me);await press('[data-a="t-new"]',me);await w(500,me);await press('[data-a="fill"]',me);await w(600,me);await press('[data-a="start"]',me);
 for(const k of ORDER){await untilPick(me);await w(700,me);
  if(k==='GPU'){await press('[data-a="boost-'+S.cands.pass[0].id+'"]',me);await w(500,me);await press('[data-a="boost-300000"]',me);await untilPick(me);await w(1200,me);if(S.adjOffer){await press('[data-a="adj-ok"]',me);await w(600,me)}}
  const it=S.cands.pass.find(x=>!x._over);await press('[data-a="pick-'+it.id+'"]',me)}
 await w(800,me);await press('[data-a="toquote"]',me);await w(2400,me);await press('[data-a="change"]',me);await w(500,me);document.getElementById('chCat').value='CASE';document.getElementById('chTxt').value='검은색 케이스를 흰색으로 바꾸고 싶어요';await w(700,me);await press('[data-a="ch-send"]',me);
 await untilPick(me);await w(1000,me);await press('[data-a="pick-'+S.cands.pass[0].id+'"]',me);await w(700,me);await press('[data-a="toquote"]',me);await w(2600,me);await press('[data-a="approve"]',me)}catch(e){if(e!=='stop')console.log(e)}running=false}
init();render();
</script>
