title = "BUILDWISE public catalog identifiers"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Match the individual finding, including its field and complete quoted value.
# A second assignment on the same JSON/CSV line must still be scanned.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Published part identifiers and 16-hex model-identity hashes"
condition = "AND"
regexTarget = "match"
paths = [
    '''^data/hardware/docyx_compatibility\.json$''',
    '''^frontend/public/demo-data/(?:parts|part_compatibility)\.snapshot\.json$''',
]
regexes = [
    '''^(?:source_key|part_[ab]_key)"[ \t]*:[ \t]*"verified-(?:cpu|ram)-[a-f0-9]{16}"$''',
    '''^(?:source_key|part_[ab]_key)"[ \t]*:[ \t]*"(?:amd-ryzen-(?:5-(?:7600|7600x|7600x3d|8400f|8500g|8600g|9600)|7-(?:7700|7700x|7800x3d|8700f|8700g|9700x|9800x3d)|9-(?:7900|7900x|7950x|7950x3d|9900x|9900x3d|9950x|9950x3d))|cpu-(?:intel-i5-12400f|r5-9600x))"$''',
    '''^(?:source_key|part_[ab]_key)"[ \t]*:[ \t]*"(?:mb-(?:asus-prime-b650-plus|msi-b760-gaming-plus)|ram-(?:crucial-ct2k16g4sfra32a|gskill-f5-6000j3636f32gx2-fx5|kingston-ksm48e40bd8km-32hm))"$''',
]

[[rules.allowlists]]
description = "Reviewed hardware power records use CPU model IDs"
condition = "AND"
regexTarget = "match"
paths = [
    '''^data/hardware/reviewed_power_specs\.json$''',
]
regexes = [
    '''^source_key"[ \t]*:[ \t]*"(?:verified-cpu-[a-f0-9]{16}|cpu-intel-i5-12400f)"$''',
]

[[rules.allowlists]]
description = "CPU support and memory QVL relationship IDs"
condition = "AND"
regexTarget = "match"
paths = [
    '''^data/hardware/docyx_compatibility\.json$''',
]
regexes = [
    '''^record_key"[ \t]*:[ \t]*"cpu-official-[0-9]{1,6}-[0-9]{1,6}"$''',
    '''^record_key"[ \t]*:[ \t]*"cpu-(?:verified-motherboard-[a-f0-9]{16}|mb-(?:asus-prime-b650-plus|msi-b760-gaming-plus))-(?:verified-cpu-[a-f0-9]{16}|(?:amd-ryzen-(?:5-(?:7600|7600x|7600x3d|8400f|8500g|8600g|9600)|7-(?:7700|7700x|7800x3d|8700f|8700g|9700x|9800x3d)|9-(?:7900|7900x|7950x|7950x3d|9900x|9900x3d|9950x|9950x3d))|cpu-(?:intel-i5-12400f|r5-9600x)))"$''',
    '''^record_key"[ \t]*:[ \t]*"qvl-(?:verified-motherboard-[a-f0-9]{16}|mb-(?:asus-prime-b650-plus|msi-b760-gaming-plus))-(?:verified-ram-[a-f0-9]{16}|ram-gskill-f5-6000j3636f32gx2-fx5)-(?:ryzen-(?:7000|8000g|9000)|intel-core-1[34]th-gen)"$''',
    '''^record_key"[ \t]*:[ \t]*"(?:asus|msi)-cpu-(?:amd-ryzen-(?:5-(?:7600|7600x|7600x3d|8400f|8500g|8600g|9600)|7-(?:7700|7700x|7800x3d|8700f|8700g|9700x|9800x3d)|9-(?:7900|7900x|7950x|7950x3d|9900x|9900x3d|9950x|9950x3d))|cpu-(?:intel-i5-12400f|r5-9600x))"$''',
    '''^record_key"[ \t]*:[ \t]*"(?:asus-qvl-b850-(?:f5-6000j3636f32gx2-fx5|ksm48e40bd8km-32hm)|gskill-qvl-(?:asus-b850|msi-b650)-f5-6000j3636f32gx2-fx5)-ryzen-(?:7000|8000g?|9000)"$''',
]

[[rules.allowlists]]
description = "Nine archived product identifiers from the two November catalog collections"
condition = "AND"
regexTarget = "match"
paths = [
    '''^data/hardware/(?:part_matches|processed/parts|raw/collection_manifest|reports/catalog_snapshot)\.json$''',
    '''^data/hardware/raw/manifests/20261111T(?:062436272105|062852109484)Z\.json$''',
    '''^data/hardware/raw/danawa/20261111T(?:062436272105|062852109484)Z/(?:amd-ryzen-5-(?:7600|8600g)|gskill-flare-x5-ddr5-6000-(?:cl30-64gb|cl36-32gb)|mb-asrock-a620am-x|psu-(?:850w-gold|msi-mpg-a850gs-pcie5)|qvl-samsung-m323r2ga3db0-cwmod|wd-black-sn7100-1tb)\.json$''',
]
regexes = [
    '''^source_key"[ \t]*:[ \t]*"(?:amd-ryzen-5-(?:7600|8600g)|gskill-flare-x5-ddr5-6000-(?:cl30-64gb|cl36-32gb)|mb-asrock-a620am-x|psu-(?:850w-gold|msi-mpg-a850gs-pcie5)|qvl-samsung-m323r2ga3db0-cwmod|wd-black-sn7100-1tb)"$''',
]

[[rules.allowlists]]
description = "Archived manufacturer evidence records"
condition = "AND"
regexTarget = "match"
paths = [
    '''^data/hardware/(?:processed/compatibility|raw/manufacturer/compatibility_review)\.json$''',
]
regexes = [
    '''^(?:source_key|part_[ab]_key)"[ \t]*:[ \t]*"(?:amd-ryzen-5-(?:7600|8600g)|gskill-flare-x5-ddr5-6000-(?:cl30-64gb|cl36-32gb)|qvl-samsung-m323r2ga3db0-cwmod)"$''',
    '''^record_key"[ \t]*:[ \t]*"(?:asrock|asus|msi)-cpu-(?:amd-ryzen-(?:5-(?:7600|8600g)|9-7900)|cpu-r5-9600x)"$''',
    '''^record_key"[ \t]*:[ \t]*"(?:asus|msi|g\.skill)-qvl-gskill-flare-x5-ddr5-6000-(?:cl36-32gb|cl30-64gb)-Ryzen-(?:7000|8000G|9000)"$''',
]

[[rules.allowlists]]
description = "Normalized GPU model names in the exported benchmark preview"
condition = "AND"
regexTarget = "match"
paths = [
    '''^docs/데이터_수집/2026-11-17/결과/normalized/benchmarks/parts_with_benchmark_references_preview\.csv$''',
]
regexes = [
    '''^model_identity_key"":""(?:amdradeon(?:prowx(?:7100|8200|9100)|rx(?:6750gre|6750xt|6950xt|7650gre))|intelarc(?:b370|b390|b570|b580)|nvidiaquadrok(?:620|1200|4200))"$''',
]

[[rules.allowlists]]
description = "Known duplicate document-key test case in an archived JUnit XML report"
condition = "AND"
regexTarget = "match"
paths = [
    '''^backend/tests/report/261119_jjb_unit_ALL_backend-suite_001\.xml$''',
]
regexes = [
    '''^rag_chunks_normalized-chunk_key-JINBONG:CHK-FW-001-duplicate[ ]$''',
]

[[rules.allowlists]]
description = "Ryzen catalog SKU in hardware evidence tests"
condition = "AND"
regexTarget = "match"
paths = [
    '''^backend/tests/hardware_workflow/test_(?:demo|consultation)_(?:memory_document|power_documents|cooling_documents)\.py$''',
]
regexes = [
    '''^source_key(?:"[ \t]*:[ \t]*|[ \t]*=[ \t]*)"amd-ryzen-5-7600"$''',
]

[[rules.allowlists]]
description = "Published SKU example in the archived shopping contract proposal"
condition = "AND"
regexTarget = "match"
paths = [
    '''^frontend/src/features/pc-consult/API_PROPOSAL\.md$''',
]
regexes = [
    '''^source_key"[ \t]*:[ \t]*"amd-ryzen-5-7600"$''',
]

[[rules.allowlists]]
description = "Literal SKU comparison in the archived consultation transcript test"
condition = "AND"
regexTarget = "match"
paths = [
    '''^frontend/src/features/pc-consult/consultTranscript\.test\.ts$''',
]
regexes = [
    '''^row\.source_key[ \t]*===[ \t]*"amd-ryzen-5-7600"$''',
]

[[rules.allowlists]]
description = "Archived TypeScript fixture refers to public part identifiers"
condition = "AND"
regexTarget = "match"
paths = [
    '''^frontend/src/features/pc-consult/fixtures/snapshot\.fixture\.ts$''',
]
regexes = [
    '''^(?:source_key|part_[ab]_key)[ \t]*:[ \t]*"(?:amd-ryzen-5-(?:7600|8600g)|amd-ryzen-7-9800x3d|mb-asus-prime-b650-plus|ram-gskill-f5-6000j3636f32gx2-fx5|verified-cpu-e2017af2302a9f77)"$''',
]
